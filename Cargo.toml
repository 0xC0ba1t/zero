[package]
name = "zero-os"
version = "0.1.0"
edition = "2021"

[build-dependencies]
bootloader = "0.11"

[dependencies]
zero = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[lib]
path = "src/lib.rs"

[workspace]
members = ["kernel"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
