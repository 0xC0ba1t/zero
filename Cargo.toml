[workspace]
resolver = "3"
members = ["kernel"]

[package]
name = "zero-os"
version = "0.1.0"
edition = "2021"

[build-dependencies]
zero = { path = "kernel", artifact = "bin", target = "x86_64-zero.json" }
bootloader = "0.11"

[lib]
path = "src/lib.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
